server.port=8080
spring.main.banner-mode=off

# --- Tomcat: se declara explicitamente (por defecto 200 hilos) ---
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# --- PostgreSQL (Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tfg_concurrencia
spring.datasource.username=tfg_user
spring.datasource.password=tfg_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Pool HikariCP: tamano fijo = hilos de Tomcat; max-lifetime en 30 min
# (en la Campania A estaba en 30 s y provocaba renovaciones masivas del pool) ---
spring.datasource.hikari.pool-name=tfg-pool
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=200
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

logging.level.root=WARN
logging.level.com.tfg=INFO
